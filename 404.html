<main>
  <h1>404</h1>

  <p><strong>Page not found :(</strong></p>
  <p>无法找到所请求的页面</p>

  <h1>如果你想访问的是我的个人网站相关页面</h1>

  <p>那么当前页面很可能已经迁移至新的域名。请点击下方链接前往对应页面。</p>

  <a id="redirect-link" href="https://komori.cc">
    <div id="target-url" class="url"></div>
  </a>
</main>

<script>
  (() => {
    // 替换成你的新域名，不要在末尾添加斜杠
    const newOrigin = "https://komori.cc";

    const targetUrl =
      newOrigin +
      window.location.pathname +
      window.location.search +
      window.location.hash;

    const link = document.getElementById("redirect-link");
    const targetText = document.getElementById("target-url");

    link.href = targetUrl;
    targetText.textContent = targetUrl;
  })();
</script>
