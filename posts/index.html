---
layout: list
title: 推文
description: 按时间排列的文章
permalink: /posts/
---

<div class="github-file-list">
  {% for post in site.posts %}
  <a class="github-file-row" href="{{ post.url | relative_url }}">
    <span class="file-icon" aria-hidden="true">
      <svg viewBox="0 0 16 16" width="16" height="16">
        <path
          fill="currentColor"
          d="M3.75 1.5a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25V5.5H9.75A1.75 1.75 0 0 1 8 3.75V1.5Zm5.75.81v1.44c0 .138.112.25.25.25h1.44ZM2 1.75C2 .784 2.784 0 3.75 0H8.5c.464 0 .91.184 1.237.513l3.75 3.75c.329.328.513.773.513 1.237v8.75A1.75 1.75 0 0 1 12.25 16h-8.5A1.75 1.75 0 0 1 2 14.25Z"
        />
      </svg>
    </span>

    <span class="file-name"> {{ post.title }} </span>

    <span class="file-description">
      {{ post.description | default: post.excerpt | strip_html | truncate: 80 }}
    </span>

    <time class="file-date" datetime="{{ post.date | date_to_xmlschema }}">
      {{ post.date | date: "%Y-%m-%d" }}
    </time>
  </a>
  {% else %}
  <p>暂无推文。</p>
  {% endfor %}
</div>
