---
layout: post
---

<header class="post-header">
  <h1>{{ page.title }}</h1>

  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%Y 年 %-m 月 %-d 日" }}
    </time>
  </p>
</header>

{{ content }}

<nav class="post-navigation" aria-label="文章翻页">
  <div>
    {% if page.previous %}
    <span>上一篇</span>
    <a href="{{ page.previous.url | relative_url }}">
      {{ page.previous.title }}
    </a>
    {% endif %}
  </div>

  <div>
    {% if page.next %}
    <span>下一篇</span>
    <a href="{{ page.next.url | relative_url }}"> {{ page.next.title }} </a>
    {% endif %}
  </div>
</nav>
