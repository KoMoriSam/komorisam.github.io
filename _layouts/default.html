<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>
      {% if page.title %} {{ page.title }} | {{ site.title }} {% else %} {{
      site.title }} {% endif %}
    </title>

    {% seo %}

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.9.0/github-markdown.min.css"
    />

    <link
      rel="stylesheet"
      href="{{ '/assets/css/github.css' | relative_url }}"
    />
  </head>

  <script src="{{ '/assets/js/github-alerts.js' | relative_url }}"></script>

  <body>
    <header class="repo-header">
      <div class="repo-header-inner">
        <div class="repo-title">
          <svg viewBox="0 0 16 16" width="32" height="32" aria-hidden="true">
            <path
              fill="currentColor"
              d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.64 5.47 7.72.4.08.55-.18.55-.39 0-.19-.01-.83-.01-1.5-2.01.38-2.53-.5-2.69-.96-.09-.23-.48-.96-.82-1.15-.28-.15-.68-.53-.01-.54.63-.01 1.08.59 1.23.83.72 1.23 1.87.88 2.33.67.07-.53.28-.88.51-1.08-1.78-.21-3.64-.91-3.64-4.02 0-.89.31-1.62.82-2.19-.08-.2-.36-1.03.08-2.16 0 0 .67-.22 2.2.84A7.5 7.5 0 0 1 8 3.94a7.5 7.5 0 0 1 2 .27c1.53-1.06 2.2-.84 2.2-.84.44 1.13.16 1.96.08 2.16.51.57.82 1.3.82 2.19 0 3.12-1.87 3.81-3.65 4.02.29.25.54.74.54 1.5 0 1.08-.01 1.95-.01 2.22 0 .21.15.47.55.39A8.15 8.15 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z"
            />
          </svg>

          <a href="https://github.com/KoMoriSam"> KoMoriSam </a>

          <span>/</span>

          <a class="repo-name" href="{{ '/' | relative_url }}">
            komorisam.github.io
          </a>

          <span class="visibility-badge">Public</span>
        </div>
      </div>

      <nav class="repo-tabs" aria-label="仓库导航">
        <a class="repo-tab active" href="{{ '/' | relative_url }}">
          <span>⌘</span>
          Code
        </a>

        <a
          class="repo-tab"
          href="https://github.com/KoMoriSam/komorisam.github.io/issues"
        >
          Issues
        </a>

        <a
          class="repo-tab"
          href="https://github.com/KoMoriSam/komorisam.github.io/discussions"
        >
          Discussions
        </a>

        <a
          class="repo-tab"
          href="https://github.com/KoMoriSam/komorisam.github.io"
        >
          Repository
        </a>
      </nav>
    </header>

    <!-- 主体 -->
    <main class="repo-content">
      <section class="branch-bar">
        <span class="branch-button">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M5.75 3.25a2.25 2.25 0 1 1-3-2.122V9.5a2.25 2.25 0 1 1-1.5 0V3.25a.75.75 0 0 1 1.5 0 2.25 2.25 0 0 1 3 0Zm-2.25-.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm0 9a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0ZM13.25 2.5a2.25 2.25 0 1 1-3 2.122V6a2.5 2.5 0 0 1-2.5 2.5H5.5a1 1 0 0 0-1 1v1a.75.75 0 0 1-1.5 0v-1A2.5 2.5 0 0 1 5.5 7h2.25a1 1 0 0 0 1-1V4.622a2.25 2.25 0 0 1 3-2.122Zm-.75.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"
            />
          </svg>

          main
        </span>

        <a
          class="code-button"
          href="https://github.com/KoMoriSam/komorisam.github.io"
        >
          &lt;&gt; Code
        </a>
      </section>

      <article class="readme-box">
        <header class="readme-header">
          <strong> {{ page.filename | default: "README.md" }} </strong>

          <a href="https://github.com/KoMoriSam/komorisam.github.io">
            View on GitHub
          </a>
        </header>

        <div class="readme-content">
          <div class="markdown-body">{{ content }}</div>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <span>© {{ 'now' | date: '%Y' }} KoMoriSam</span>

      <a href="https://github.com/KoMoriSam"> GitHub </a>
    </footer>
  </body>
</html>
